<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企鵝皮皮與海豹波波 - 幼兒動畫影片播放器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent: #38bdf8;
      --pastel-green: #a7f3d0;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #38bdf8, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .player-wrapper {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    .scene-markers {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .scene-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .scene-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
    }
    .scene-time {
      font-size: 0.75rem;
      color: var(--pastel-green);
      font-weight: 700;
    }
    .scene-title {
      font-size: 0.85rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐧 企鵝皮皮與海豹波波 - 幼兒動畫影片播放器 🦭</h1>
    <p class="subtitle">專門低剪輯頻率・慢速運鏡・柔和彩度 (1080p / 60fps)</p>
  </header>

  <div class="player-wrapper">
    <div class="video-box">
      <video id="pipiVideo" controls autoplay loop>
        <source src="pipi_penguin_story.mp4" type="video/mp4">
        您的瀏覽器不支援 HTML5 影片播放。
      </video>
    </div>

    <div style="margin-top: 16px; font-size: 0.9rem; color: var(--text-muted); text-align: center;">
      點擊下方時間點可跳轉至指定故事場景：
    </div>

    <div class="scene-markers">
      <div class="scene-btn" onclick="seekTo(0)">
        <div class="scene-time">00:00 (13.0s)</div>
        <div class="scene-title">1. 害羞的皮皮獨自散步</div>
      </div>
      <div class="scene-btn" onclick="seekTo(13)">
        <div class="scene-time">00:13 (14.0s)</div>
        <div class="scene-title">2. 遇見迷路的小海豹波波</div>
      </div>
      <div class="scene-btn" onclick="seekTo(27)">
        <div class="scene-time">00:27 (14.0s)</div>
        <div class="scene-title">3. 冰原上的肚皮滑冰遊戲</div>
      </div>
      <div class="scene-btn" onclick="seekTo(41)">
        <div class="scene-time">00:41 (14.0s)</div>
        <div class="scene-title">4. 黃昏夕陽與媽媽的重逢</div>
      </div>
      <div class="scene-btn" onclick="seekTo(55)">
        <div class="scene-time">00:55 (13.0s)</div>
        <div class="scene-title">5. 感受友誼與勇氣的溫暖</div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('pipiVideo');
    function seekTo(sec) {
      video.currentTime = sec;
      video.play();
    }
  </script>
</body>
</html>
